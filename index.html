<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>Daily Note</title>
  
  <link rel="manifest" href="manifest.json?v=5">
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/calendar--v1.png">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Note">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: sans-serif; 
      background-color: #f7f6f2; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      padding-top: 10px;
    }
    
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background-color: #f7f6f2; border-bottom: 1px solid #e2e0d8; flex-shrink: 0; z-index: 10; }
    .nav-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .sync-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: #4caf50; display: inline-block; transition: background-color 0.3s; }
    .sync-indicator.syncing { background-color: #ff9800; }
    
    button { background: #ffffff; border: 1px solid #d0cecd; padding: 5px 12px; border-radius: 4px; font-size: 13.5px; cursor: pointer; color: #333; }
    button:active { background-color: #eae8e1; }
    
    .viewport-container {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    
    .carousel-track {
      display: flex;
      width: 300%;
      height: 100%;
      will-change: transform;
      transform: translate3d(-33.3333%, 0, 0);
    }

    .month-view {
      width: 33.3333%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      will-change: opacity;
    }
    
    .weekdays-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #f0eee8; border-bottom: 1px solid #e2e0d8; font-size: 9px; text-align: center; color: #666; padding: 6px 0; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; background-color: #e5e3dc; gap: 1px; }
    .day-cell { background-color: #ffffff; min-height: 82.5px; display: flex; flex-direction: column; padding: 1px 2px 4px 1px; }
    .day-cell.empty-cell { background-color: #f7f6f2; border: none; }
    
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; line-height: 1; }
    .date-num { font-size: 10px; font-weight: 800; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .day-cell.today .date-num { background-color: #444; color: #fff; }
    
    .mark-btn { width: 12px; height: 12px; border: 1px solid #ccc; border-radius: 50%; background-color: #fff; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mark-btn.checked { background-color: #a33b3b; border-color: #a33b3b; }
    .mark-btn.checked::after { content: ''; width: 2px; height: 4px; border: solid white; border-width: 0 1.2px 1.2px 0; transform: rotate(45deg); margin-bottom: 1px; }
    
    .cell-editor { flex: 1; width: 100%; border: none; font-size: 8.6px; line-height: 1.35; color: #222; resize: none; outline: none; background: transparent; font-family: inherit; padding: 0; }
    .cell-editor::placeholder { color: #d8d6cf; }
    
    .monthly-note-box { padding: 10px; background: #e5e3dc; border-top: 1px solid #dcdad4; }
    .monthly-note-textarea { width: 100%; height: 80px; border: 1px solid #d0cecd; border-radius: 4px; padding: 8px; font-size: 11px; color: #222; background: #fff; resize: none; outline: none; font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="nav-title"><span id="month-title">-- 年 -- 月</span><span class="sync-indicator" id="sync-status" title="雲端同步狀態"></span></div>
    <div style="display:flex; gap:6px;">
      <button onclick="goToCurrentMonth()">今天</button>
    </div>
  </header>
  
  <div class="viewport-container" id="viewport">
    <div class="carousel-track" id="track">
      <div class="month-view" id="view-prev"></div>
      <div class="month-view" id="view-current"></div>
      <div class="month-view" id="view-next"></div>
    </div>
  </div>

  <script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbzvq92u9Hswly1GTVhGA4v7j_O9XJ0FNnOGYWKdjxvl0Qu0TXPAuK9aNQgsCwbzWAm_9Q/exec"; 
    
    let baseDate = new Date();
    const monthTitle = document.getElementById('month-title');
    const syncStatus = document.getElementById('sync-status');
    const track = document.getElementById('track');
    const viewport = document.getElementById('viewport');
    const viewPrev = document.getElementById('view-prev');
    const viewCurrent = document.getElementById('view-current');
    const viewNext = document.getElementById('view-next');
    let saveTimeout = null;
    let isTransitioning = false;

    function formatDateKey(year, month, day) {
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function setSyncState(isSyncing) {
      syncStatus.classList.toggle('syncing', isSyncing);
    }

    function syncToCloud(key, val) {
      if (!CLOUD_API_URL) return;
      setSyncState(true);
      fetch(CLOUD_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, val: val })
      }).then(() => {
        setTimeout(() => setSyncState(false), 400);
      }).catch(() => setSyncState(false));
    }

    function fetchCloudData() {
      if (!CLOUD_API_URL) return;
      setSyncState(true);
      fetch(CLOUD_API_URL)
        .then(res => res.json())
        .then(data => {
          Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
          renderViews();
          setSyncState(false);
        })
        .catch(() => setSyncState(false));
    }

    function generateMonthHTML(dateObj) {
      const year = dateObj.getFullYear();
      const month = dateObj.getMonth() + 1;
      
      const firstDayIndex = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;

      let html = `<div class="weekdays-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="month-grid">`;
      
      for (let i = 0; i < firstDayIndex; i++) {
        html += `<div class="day-cell empty-cell"></div>`;
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = formatDateKey(year, month, day);
        const isToday = isCurrentMonth && today.getDate() === day;
        const savedText = localStorage.getItem(`note_${dateKey}`) || '';
        const isMarked = localStorage.getItem(`mark_${dateKey}`) === '1';

        html += `
          <div class="day-cell ${isToday ? 'today' : ''}">
            <div class="day-header">
              <span class="date-num">${day}</span>
              <button class="mark-btn ${isMarked ? 'checked' : ''}" data-key="${dateKey}"></button>
            </div>
            <textarea class="cell-editor" placeholder="" data-key="${dateKey}">${savedText}</textarea>
          </div>`;
      }
      html += `</div>`;
      
      const monthKey = `note_monthly_${year}_${String(month).padStart(2, '0')}`;
      const savedMonthlyNote = localStorage.getItem(monthKey) || '';
      
      html += `
        <div class="monthly-note-box">
          <textarea class="monthly-note-textarea" placeholder="其他" data-monthkey="${monthKey}">${savedMonthlyNote}</textarea>
        </div>`;
      
      return html;
    }

    function setOpacities(prevOp, curOp, nextOp) {
      viewPrev.style.opacity = prevOp;
      viewCurrent.style.opacity = curOp;
      viewNext.style.opacity = nextOp;
    }

    function renderViews() {
      const prevDate = new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1);
      const nextDate = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1);
      
      monthTitle.innerText = `${baseDate.getFullYear()} 年 ${baseDate.getMonth() + 1} 月`;

      viewPrev.innerHTML = generateMonthHTML(prevDate);
      viewCurrent.innerHTML = generateMonthHTML(baseDate);
      viewNext.innerHTML = generateMonthHTML(nextDate);
      
      setOpacities('0.35', '1', '0.35');

      track.style.transition = 'none';
      track.style.transform = 'translate3d(-33.3333%, 0, 0)';
    }

    function goToCurrentMonth() {
      baseDate = new Date();
      renderViews();
    }

    viewport.addEventListener('input', (e) => {
      const target = e.target;
      if (target.classList.contains('cell-editor')) {
        const key = `note_${target.getAttribute('data-key')}`;
        const val = target.value;
        localStorage.setItem(key, val);
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => syncToCloud(key, val), 800);
      } else if (target.classList.contains('monthly-note-textarea')) {
        const key = target.getAttribute('data-monthkey');
        const val = target.value;
        localStorage.setItem(key, val);
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => syncToCloud(key, val), 800);
      }
    });

    viewport.addEventListener('click', (e) => {
      const target = e.target.closest('.mark-btn');
      if (target) {
        const rawKey = target.getAttribute('data-key');
        const key = `mark_${rawKey}`;
        target.classList.toggle('checked');
        const val = target.classList.contains('checked') ? '1' : '0';
        localStorage.setItem(key, val);
        syncToCloud(key, val);
      }
    });

    // 極速平滑觸控監聽
    let startX = 0, startY = 0, currentX = 0;
    let isDragging = false, isHorizontal = null;
    let trackWidth = 0;

    viewport.addEventListener('touchstart', (e) => {
      if (isTransitioning) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      currentX = startX;
      isDragging = true;
      isHorizontal = null;
      trackWidth = viewport.clientWidth;
      track.style.transition = 'none';
      viewPrev.style.transition = 'none';
      viewCurrent.style.transition = 'none';
      viewNext.style.transition = 'none';
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (!isDragging || isTransitioning) return;
      currentX = e.touches[0].clientX;
      const diffX = currentX - startX;
      const diffY = e.touches[0].clientY - startY;

      if (isHorizontal === null) {
        if (Math.abs(diffX) > 6 || Math.abs(diffY) > 6) {
          isHorizontal = Math.abs(diffX) > Math.abs(diffY);
        }
      }

      if (isHorizontal) {
        if (e.cancelable) e.preventDefault();
        const percent = -33.3333 + (diffX / (trackWidth * 3)) * 100;
        track.style.transform = `translate3d(${percent}%, 0, 0)`;

        // 即時計算動態透明度過渡
        const progress = Math.min(Math.abs(diffX) / trackWidth, 1);
        const curOp = 1 - progress * 0.65;
        const targetOp = 0.35 + progress * 0.65;

        if (diffX > 0) {
          setOpacities(targetOp, curOp, '0.35');
        } else {
          setOpacities('0.35', curOp, targetOp);
        }
      }
    }, { passive: false });

    viewport.addEventListener('touchend', () => {
      if (!isDragging || !isHorizontal || isTransitioning) {
        isDragging = false;
        return;
      }
      isDragging = false;
      
      const diffX = currentX - startX;
      const threshold = trackWidth * 0.18;

      track.style.transition = 'transform 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
      viewPrev.style.transition = 'opacity 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
      viewCurrent.style.transition = 'opacity 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
      viewNext.style.transition = 'opacity 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
      
      if (diffX > threshold) {
        isTransitioning = true;
        setOpacities('1', '0.35', '0.35');
        track.style.transform = 'translate3d(0%, 0, 0)';
        setTimeout(() => {
          baseDate.setMonth(baseDate.getMonth() - 1);
          // 靜默重置 DOM 與位置
          viewCurrent.innerHTML = viewPrev.innerHTML;
          monthTitle.innerText = `${baseDate.getFullYear()} 年 ${baseDate.getMonth() + 1} 月`;
          track.style.transition = 'none';
          track.style.transform = 'translate3d(-33.3333%, 0, 0)';
          setOpacities('0.35', '1', '0.35');
          
          // 非同步補齊兩側月份
          setTimeout(() => {
            const prevDate = new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1);
            const nextDate = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1);
            viewPrev.innerHTML = generateMonthHTML(prevDate);
            viewNext.innerHTML = generateMonthHTML(nextDate);
            isTransitioning = false;
          }, 20);
        }, 260);
      } else if (diffX < -threshold) {
        isTransitioning = true;
        setOpacities('0.35', '0.35', '1');
        track.style.transform = 'translate3d(-66.6666%, 0, 0)';
        setTimeout(() => {
          baseDate.setMonth(baseDate.getMonth() + 1);
          // 靜默重置 DOM 與位置
          viewCurrent.innerHTML = viewNext.innerHTML;
          monthTitle.innerText = `${baseDate.getFullYear()} 年 ${baseDate.getMonth() + 1} 月`;
          track.style.transition = 'none';
          track.style.transform = 'translate3d(-33.3333%, 0, 0)';
          setOpacities('0.35', '1', '0.35');
          
          // 非同步補齊兩側月份
          setTimeout(() => {
            const prevDate = new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1);
            const nextDate = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1);
            viewPrev.innerHTML = generateMonthHTML(prevDate);
            viewNext.innerHTML = generateMonthHTML(nextDate);
            isTransitioning = false;
          }, 20);
        }, 260);
      } else {
        setOpacities('0.35', '1', '0.35');
        track.style.transform = 'translate3d(-33.3333%, 0, 0)';
      }
    }, { passive: true });

    renderViews();
    fetchCloudData();
  </script>
</body>
</html>
