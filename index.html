<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Note</title>
  <link rel="manifest" href="manifest.json?v=17">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; background-color: #f7f6f2; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-top: 10px; }
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background-color: #f7f6f2; border-bottom: 1px solid #e2e0d8; flex-shrink: 0; z-index: 10; }
    .viewport-container { flex: 1; width: 100%; overflow: hidden; position: relative; }
    .month-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; will-change: transform, opacity; opacity: 0.38; transition: opacity 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
    .month-view.active-month { opacity: 1; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; background-color: #e5e3dc; gap: 1px; }
    .day-cell { background-color: #ffffff; min-height: 82.5px; display: flex; flex-direction: column; padding: 4px; cursor: pointer; }
    .day-cell.empty-cell { background-color: #f7f6f2; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .mark-btn { width: 12px; height: 12px; border: 1px solid #ccc; border-radius: 50%; background: #fff; }
    .mark-btn.checked { background: #a33b3b; border-color: #a33b3b; }
    .cell-preview { font-size: 8px; color: #666; line-height: 1.2; overflow: hidden; }
    #editor-modal { position: fixed; bottom: -60%; left: 0; width: 100%; height: 60vh; background: #fff; z-index: 100; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); transition: bottom 0.3s cubic-bezier(0.22, 1, 0.36, 1); display: flex; flex-direction: column; padding: 20px; }
    #editor-modal.open { bottom: 0; }
    #modal-textarea { flex: 1; border: none; font-size: 15px; outline: none; width: 100%; resize: none; }
  </style>
</head>
<body>
  <header>
    <div class="nav-title"><span id="month-title">-- 年 -- 月</span></div>
    <button onclick="baseDate=new Date(); renderAll();">今天</button>
  </header>
  <div class="viewport-container" id="viewport">
    <div class="month-view" id="p0"></div><div class="month-view active-month" id="p1"></div><div class="month-view" id="p2"></div>
  </div>
  <div id="editor-modal">
    <div style="font-weight:bold; margin-bottom:10px;" id="modal-date-title"></div>
    <textarea id="modal-textarea"></textarea>
    <button onclick="closeModal()" style="padding:12px; background:#444; color:#fff; border-radius:8px;">儲存</button>
  </div>

  <script>
    const CLOUD = "https://script.google.com/macros/s/AKfycbzvq92u9Hswly1GTVhGA4v7j_O9XJ0FNnOGYWKdjxvl0Qu0TXPAuK9aNQgsCwbzWAm_9Q/exec";
    let baseDate = new Date(), activeKey = null;
    const panels = [document.getElementById('p0'), document.getElementById('p1'), document.getElementById('p2')];
    let map = [0, 1, 2];

    function populate(p, date) {
      const y = date.getFullYear(), m = date.getMonth()+1, first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate();
      let html = `<div class="month-grid">`;
      for(let i=0; i<42; i++) {
        const d = i - first + 1;
        if(i < first || i >= first+days) html += `<div class="day-cell empty-cell"></div>`;
        else {
          const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          html += `<div class="day-cell" onclick="openModal('${key}')">
            <div class="day-header"><span style="font-weight:800;">${d}</span>
            <button class="mark-btn ${localStorage.getItem('mark_'+key)==='1'?'checked':''}" onclick="event.stopPropagation(); toggleMark('${key}')"></button></div>
            <div class="cell-preview">${localStorage.getItem('note_'+key) || ''}</div></div>`;
        }
      }
      p.innerHTML = html + `</div>`;
    }

    function renderAll() {
      document.getElementById('month-title').innerText = `${baseDate.getFullYear()} 年 ${baseDate.getMonth()+1} 月`;
      populate(panels[map[0]], new Date(baseDate.getFullYear(), baseDate.getMonth()-1, 1));
      populate(panels[map[1]], baseDate);
      populate(panels[map[2]], new Date(baseDate.getFullYear(), baseDate.getMonth()+1, 1));
      setPos(0);
    }

    function setPos(off) {
      panels[map[0]].style.transform = `translate3d(${-100+off}%,0,0)`;
      panels[map[1]].style.transform = `translate3d(${off}%,0,0)`;
      panels[map[2]].style.transform = `translate3d(${100+off}%,0,0)`;
    }

    function openModal(k) { activeKey = k; document.getElementById('modal-date-title').innerText = k; document.getElementById('modal-textarea').value = localStorage.getItem('note_'+k) || ''; document.getElementById('editor-modal').classList.add('open'); }
    function closeModal() { document.getElementById('editor-modal').classList.remove('open'); renderAll(); }
    function toggleMark(k) { const c = localStorage.getItem('mark_'+k)==='1'; localStorage.setItem('mark_'+k, c?'0':'1'); fetch(CLOUD, {method:"POST", mode:"no-cors", body:JSON.stringify({key:'mark_'+k, val:c?'0':'1'})}); renderAll(); }

    document.getElementById('modal-textarea').oninput = (e) => { 
      localStorage.setItem('note_'+activeKey, e.target.value); 
      fetch(CLOUD, {method:"POST", mode:"no-cors", body:JSON.stringify({key:'note_'+activeKey, val:e.target.value})});
    };

    let startX = 0, isDragging = false;
    viewport.ontouchstart = (e) => { startX = e.touches[0].clientX; isDragging = true; };
    viewport.ontouchmove = (e) => { if(isDragging) setPos(((e.touches[0].clientX - startX)/viewport.clientWidth)*100); };
    viewport.ontouchend = (e) => {
      isDragging = false;
      const diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) < 50) setPos(0);
      else {
        if (diff > 0) { baseDate.setMonth(baseDate.getMonth()-1); map = [map[2], map[0], map[1]]; }
        else { baseDate.setMonth(baseDate.getMonth()+1); map = [map[1], map[2], map[0]]; }
        renderAll();
      }
    };
    renderAll();
  </script>
</body>
</html>
