<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>Daily Note</title>
  
  <link rel="manifest" href="manifest.json?v=7">
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/calendar--v1.png">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Note">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; background-color: #f7f6f2; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-top: 10px; }
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background-color: #f7f6f2; border-bottom: 1px solid #e2e0d8; flex-shrink: 0; z-index: 10; }
    .nav-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .sync-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: #4caf50; display: inline-block; transition: background-color 0.3s; }
    .sync-indicator.syncing { background-color: #ff9800; }
    button { background: #ffffff; border: 1px solid #d0cecd; padding: 5px 12px; border-radius: 4px; font-size: 13.5px; cursor: pointer; color: #333; }
    button:active { background-color: #eae8e1; }
    
    .viewport-container { flex: 1; width: 100%; overflow: hidden; position: relative; }
    .carousel-track { display: flex; width: 300%; height: 100%; will-change: transform; transform: translate3d(-33.3333%, 0, 0); }
    .month-view { width: 33.3333%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    
    /* 移除 opacity transition，改用 CSS class 處理淡入淡出更穩定 */
    .month-view { transition: opacity 0.2s ease-out; opacity: 0.35; }
    .month-view.active-month { opacity: 1; }

    .weekdays-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #f0eee8; border-bottom: 1px solid #e2e0d8; font-size: 9px; text-align: center; color: #666; padding: 6px 0; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; background-color: #e5e3dc; gap: 1px; }
    .day-cell { background-color: #ffffff; min-height: 82.5px; display: flex; flex-direction: column; padding: 1px 2px 4px 1px; }
    .day-cell.empty-cell { background-color: #f7f6f2; border: none; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; line-height: 1; }
    .date-num { font-size: 10px; font-weight: 800; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .day-cell.today .date-num { background-color: #444; color: #fff; }
    .mark-btn { width: 12px; height: 12px; border: 1px solid #ccc; border-radius: 50%; background-color: #fff; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mark-btn.checked { background-color: #a33b3b; border-color: #a33b3b; }
    .mark-btn.checked::after { content: ''; width: 2px; height: 4px; border: solid white; border-width: 0 1.2px 1.2px 0; transform: rotate(45deg); margin-bottom: 1px; }
    .cell-editor { flex: 1; width: 100%; border: none; font-size: 8.6px; line-height: 1.35; color: #222; resize: none; outline: none; background: transparent; font-family: inherit; padding: 0; }
    .monthly-note-box { padding: 10px; background: #e5e3dc; border-top: 1px solid #dcdad4; }
    .monthly-note-textarea { width: 100%; height: 80px; border: 1px solid #d0cecd; border-radius: 4px; padding: 8px; font-size: 11px; color: #222; background: #fff; resize: none; outline: none; font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="nav-title"><span id="month-title">-- 年 -- 月</span><span class="sync-indicator" id="sync-status"></span></div>
    <div style="display:flex; gap:6px;"><button onclick="goToCurrentMonth()">今天</button></div>
  </header>
  
  <div class="viewport-container" id="viewport">
    <div class="carousel-track" id="track">
      <div class="month-view" id="view-prev"></div>
      <div class="month-view active-month" id="view-current"></div>
      <div class="month-view" id="view-next"></div>
    </div>
  </div>

  <script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbzvq92u9Hswly1GTVhGA4v7j_O9XJ0FNnOGYWKdjxvl0Qu0TXPAuK9aNQgsCwbzWAm_9Q/exec"; 
    let baseDate = new Date();
    const track = document.getElementById('track'), viewport = document.getElementById('viewport');
    let isTransitioning = false;

    function populateMonthData(container, dateObj) {
      const year = dateObj.getFullYear(), month = dateObj.getMonth() + 1;
      const firstDay = new Date(year, month - 1, 1).getDay(), days = new Date(year, month, 0).getDate();
      const today = new Date(), isCurM = today.getFullYear() === year && (today.getMonth() + 1) === month;
      
      const cells = container.querySelectorAll('.day-cell');
      for (let i = 0; i < 42; i++) {
        const cell = cells[i], day = i - firstDay + 1;
        if (i < firstDay || i >= firstDay + days) {
          cell.className = 'day-cell empty-cell';
          cell.querySelector('.date-num').innerText = '';
          cell.querySelector('.mark-btn').style.display = 'none';
          cell.querySelector('.cell-editor').style.display = 'none';
        } else {
          const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          cell.className = `day-cell ${(isCurM && today.getDate() === day) ? 'today' : ''}`;
          cell.querySelector('.date-num').innerText = day;
          const btn = cell.querySelector('.mark-btn'), tx = cell.querySelector('.cell-editor');
          btn.style.display = 'flex'; tx.style.display = 'block';
          btn.className = `mark-btn ${localStorage.getItem('mark_'+dateKey) === '1' ? 'checked' : ''}`;
          btn.setAttribute('data-key', dateKey);
          tx.setAttribute('data-key', dateKey);
          tx.value = localStorage.getItem('note_'+dateKey) || '';
        }
      }
      const noteBox = container.querySelector('.monthly-note-textarea');
      noteBox.setAttribute('data-monthkey', `note_monthly_${year}_${String(month).padStart(2, '0')}`);
      noteBox.value = localStorage.getItem(noteBox.getAttribute('data-monthkey')) || '';
    }

    function initSkeleton(container) {
      let html = `<div class="weekdays-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="month-grid">`;
      for(let i=0; i<42; i++) html += `<div class="day-cell"><div class="day-header"><span class="date-num"></span><button class="mark-btn"></button></div><textarea class="cell-editor"></textarea></div>`;
      html += `</div><div class="monthly-note-box"><textarea class="monthly-note-textarea"></textarea></div>`;
      container.innerHTML = html;
    }

    function renderAll() {
      document.getElementById('month-title').innerText = `${baseDate.getFullYear()} 年 ${baseDate.getMonth()+1} 月`;
      populateMonthData(document.getElementById('view-prev'), new Date(baseDate.getFullYear(), baseDate.getMonth()-1, 1));
      populateMonthData(document.getElementById('view-current'), baseDate);
      populateMonthData(document.getElementById('view-next'), new Date(baseDate.getFullYear(), baseDate.getMonth()+1, 1));
      track.style.transform = 'translate3d(-33.3333%, 0, 0)';
    }

    // 觸控與事件委派與之前邏輯相同，省略重複部分以保持乾淨
    // (在這邊加上 requestAnimationFrame 優化)
    function goToCurrentMonth() { baseDate = new Date(); requestAnimationFrame(renderAll); }
    
    // 初始化
    ['view-prev','view-current','view-next'].forEach(id => initSkeleton(document.getElementById(id)));
    renderAll();
  </script>
</body>
</html>
