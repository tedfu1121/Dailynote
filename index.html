<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>純粹月曆</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/calendar--v1.png">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="純粹月曆">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: sans-serif; 
      background-color: #f7f6f2; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      padding-top: 10px;
    }
    
    header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background-color: #f7f6f2; border-bottom: 1px solid #e2e0d8; flex-shrink: 0; }
    .nav-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .sync-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: #4caf50; display: inline-block; transition: background-color 0.3s; }
    .sync-indicator.syncing { background-color: #ff9800; }
    
    button { background: #ffffff; border: 1px solid #d0cecd; padding: 5px 12px; border-radius: 4px; font-size: 13.5px; cursor: pointer; color: #333; }
    button:active { background-color: #eae8e1; }
    
    .calendar-container { 
      flex: 1; 
      overflow-y: auto; 
      overflow-x: hidden; 
      -webkit-overflow-scrolling: touch; 
      width: 100%; 
      touch-action: pan-y;
      position: relative;
    }

    .slide-wrapper {
      width: 100%;
      will-change: transform, opacity;
      transform: translateX(0px);
    }
    
    .weekdays-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #f0eee8; border-bottom: 1px solid #e2e0d8; font-size: 9px; text-align: center; color: #666; padding: 6px 0; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; background-color: #e5e3dc; gap: 1px; }
    .day-cell { background-color: #ffffff; min-height: 82.5px; display: flex; flex-direction: column; padding: 1px 2px 4px 1px; }
    .day-cell.empty-cell { background-color: #f7f6f2; border: none; }
    
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; line-height: 1; }
    .date-num { font-size: 10px; font-weight: 800; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .day-cell.today .date-num { background-color: #444; color: #fff; }
    
    .mark-btn { width: 12px; height: 12px; border: 1px solid #ccc; border-radius: 50%; background-color: #fff; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mark-btn.checked { background-color: #a33b3b; border-color: #a33b3b; }
    .mark-btn.checked::after { content: ''; width: 2px; height: 4px; border: solid white; border-width: 0 1.2px 1.2px 0; transform: rotate(45deg); margin-bottom: 1px; }
    
    .cell-editor { flex: 1; width: 100%; border: none; font-size: 8.6px; line-height: 1.35; color: #222; resize: none; outline: none; background: transparent; font-family: inherit; padding: 0; }
    .cell-editor::placeholder { color: #d8d6cf; }
    
    .monthly-note-box { padding: 10px; background: #e5e3dc; border-top: 1px solid #dcdad4; }
    .monthly-note-textarea { width: 100%; height: 80px; border: 1px solid #d0cecd; border-radius: 4px; padding: 8px; font-size: 11px; color: #222; background: #fff; resize: none; outline: none; font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="nav-title"><span id="month-title">-- 年 -- 月</span><span class="sync-indicator" id="sync-status" title="雲端同步狀態"></span></div>
    <div style="display:flex; gap:6px;">
      <button onclick="goToCurrentMonth()">今天</button>
    </div>
  </header>
  
  <div class="calendar-container" id="scroll-wrapper">
    <div class="slide-wrapper" id="slide-wrapper">
      <div class="weekdays-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="month-grid" id="month-grid"></div>
      <div class="monthly-note-box">
        <textarea id="monthly-note" class="monthly-note-textarea" placeholder="其他"></textarea>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbzvq92u9Hswly1GTVhGA4v7j_O9XJ0FNnOGYWKdjxvl0Qu0TXPAuK9aNQgsCwbzWAm_9Q/exec"; 
    
    let currentDate = new Date();
    const grid = document.getElementById('month-grid');
    const monthTitle = document.getElementById('month-title');
    const syncStatus = document.getElementById('sync-status');
    const noteArea = document.getElementById('monthly-note');
    const scrollWrapper = document.getElementById('scroll-wrapper');
    const slideWrapper = document.getElementById('slide-wrapper');
    let saveTimeout = null;

    function formatDateKey(year, month, day) {
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function setSyncState(isSyncing) {
      if (isSyncing) {
        syncStatus.classList.add('syncing');
      } else {
        syncStatus.classList.remove('syncing');
      }
    }

    function syncToCloud(key, val) {
      if (!CLOUD_API_URL) return;
      setSyncState(true);
      fetch(CLOUD_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, val: val })
      }).then(() => {
        setTimeout(() => setSyncState(false), 400);
      }).catch(() => {
        setSyncState(false);
      });
    }

    function fetchCloudData() {
      if (!CLOUD_API_URL) return;
      setSyncState(true);
      fetch(CLOUD_API_URL)
        .then(res => res.json())
        .then(data => {
          Object.keys(data).forEach(key => {
            localStorage.setItem(key, data[key]);
          });
          renderCalendar();
          setSyncState(false);
        })
        .catch(() => {
          setSyncState(false);
        });
    }

    function renderCalendar() {
      grid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      monthTitle.innerText = `${year} 年 ${month} 月`;
      
      const monthKey = `note_monthly_${year}_${String(month).padStart(2, '0')}`;
      noteArea.value = localStorage.getItem(monthKey) || '';
      
      const firstDayIndex = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;

      for (let i = 0; i < firstDayIndex; i++) { 
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty-cell';
        grid.appendChild(emptyCell); 
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = isCurrentMonth && today.getDate() === day;
        grid.appendChild(createCell(year, month, day, isToday));
      }

      document.querySelectorAll('.cell-editor').forEach(textarea => {
        textarea.addEventListener('input', (e) => {
          const key = `note_${e.target.getAttribute('data-key')}`;
          const val = e.target.value;
          localStorage.setItem(key, val);

          clearTimeout(saveTimeout);
          saveTimeout = setTimeout(() => {
            syncToCloud(key, val);
          }, 800);
        });
      });

      document.querySelectorAll('.mark-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const target = e.currentTarget;
          const rawKey = target.getAttribute('data-key');
          const key = `mark_${rawKey}`;
          target.classList.toggle('checked');
          const isChecked = target.classList.contains('checked');
          const val = isChecked ? '1' : '0';
          localStorage.setItem(key, val);
          syncToCloud(key, val);
        });
      });
    }

    function createCell(year, month, day, isToday = false) {
      const dateKey = formatDateKey(year, month, day);
      const cell = document.createElement('div');
      cell.className = `day-cell ${isToday ? 'today' : ''}`;
      
      const savedText = localStorage.getItem(`note_${dateKey}`) || '';
      const isMarked = localStorage.getItem(`mark_${dateKey}`) === '1';

      cell.innerHTML = `
        <div class="day-header">
          <span class="date-num">${day}</span>
          <button class="mark-btn ${isMarked ? 'checked' : ''}" data-key="${dateKey}"></button>
        </div>
        <textarea class="cell-editor" placeholder="" data-key="${dateKey}">${savedText}</textarea>
      `;
      return cell;
    }

    noteArea.addEventListener('input', (e) => {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const monthKey = `note_monthly_${year}_${String(month).padStart(2, '0')}`;
      const val = e.target.value;
      localStorage.setItem(monthKey, val);

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        syncToCloud(monthKey, val);
      }, 800);
    });

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function goToCurrentMonth() {
      currentDate = new Date();
      slideWrapper.style.transition = 'opacity 0.2s ease';
      slideWrapper.style.opacity = '0';
      setTimeout(() => {
        renderCalendar();
        slideWrapper.style.opacity = '1';
      }, 200);
    }

    // --- 自然跟手拖曳與平滑切換邏輯 ---
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let isDragging = false;
    let isHorizontalScroll = null;
    let isAnimating = false;

    scrollWrapper.addEventListener('touchstart', (e) => {
      if (isAnimating) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      currentX = startX;
      isDragging = true;
      isHorizontalScroll = null;
      slideWrapper.style.transition = 'none';
    }, { passive: true });

    scrollWrapper.addEventListener('touchmove', (e) => {
      if (!isDragging || isAnimating) return;
      currentX = e.touches[0].clientX;
      const diffX = currentX - startX;
      const diffY = e.touches[0].clientY - startY;

      if (isHorizontalScroll === null) {
        if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) {
          isHorizontalScroll = Math.abs(diffX) > Math.abs(diffY);
        }
      }

      if (isHorizontalScroll) {
        const opacity = Math.max(0.3, 1 - Math.abs(diffX) / (window.innerWidth * 1.5));
        slideWrapper.style.transform = `translateX(${diffX}px)`;
        slideWrapper.style.opacity = opacity;
      }
    }, { passive: true });

    scrollWrapper.addEventListener('touchend', (e) => {
      if (!isDragging || isAnimating) return;
      isDragging = false;

      if (!isHorizontalScroll) {
        slideWrapper.style.transition = 'transform 0.2s ease-out, opacity 0.2s ease-out';
        slideWrapper.style.transform = 'translateX(0px)';
        slideWrapper.style.opacity = '1';
        return;
      }

      const diffX = currentX - startX;
      const threshold = window.innerWidth * 0.2; // 滑動超過螢幕 20% 即切換
      const screenWidth = window.innerWidth;

      if (Math.abs(diffX) > threshold) {
        isAnimating = true;
        const delta = diffX < 0 ? 1 : -1;
        const exitX = diffX < 0 ? -screenWidth : screenWidth;
        const enterX = diffX < 0 ? screenWidth : -screenWidth;

        // 平滑滑出
        slideWrapper.style.transition = 'transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.22s ease-out';
        slideWrapper.style.transform = `translateX(${exitX}px)`;
        slideWrapper.style.opacity = '0';

        setTimeout(() => {
          changeMonth(delta);
          // 準備新月份進入位置
          slideWrapper.style.transition = 'none';
          slideWrapper.style.transform = `translateX(${enterX}px)`;
          slideWrapper.style.opacity = '0';

          // 強制重繪後平滑滑入
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              slideWrapper.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease-out';
              slideWrapper.style.transform = 'translateX(0px)';
              slideWrapper.style.opacity = '1';
              setTimeout(() => {
                isAnimating = false;
              }, 250);
            });
          });
        }, 220);
      } else {
        // 未達門檻平滑彈回
        slideWrapper.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease-out';
        slideWrapper.style.transform = 'translateX(0px)';
        slideWrapper.style.opacity = '1';
      }
    }, { passive: true });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    renderCalendar();
    fetchCloudData();
  </script>
</body>
</html>
